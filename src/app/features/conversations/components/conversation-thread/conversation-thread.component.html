<div class="space-y-3">
  @for (m of visibleMessages; track m.id) {
    <div class="rounded border border-[#00187C]/10 bg-white/80 p-3">
      <div class="text-[10px] uppercase tracking-wide text-[#00187C]/50 mb-1">{{ m.role }}</div>
      <div class="text-sm text-[#00187C] whitespace-pre-wrap">{{ m.content }}</div>
    </div>
  }
  @empty {
    <div class="text-xs text-[#00187C]/50">No messages yet. Say hello to start.</div>
  }
</div>
